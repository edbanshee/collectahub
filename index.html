<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CollectaHub</title>
    <meta name="description" content="CollectaHub - Centro integral de gestión de hardware, almacenamiento, accesorios y emulación retro." />
    <meta property="og:title" content="CollectaHub" />
    <meta property="og:description" content="CollectaHub - Centro integral de gestión de hardware, almacenamiento, accesorios y emulación retro." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      // Suppress Vite dev server WebSocket disconnect errors in iframe preview
      window.addEventListener('unhandledrejection', function (e) {
        if (e.reason && (e.reason.message || '').includes('WebSocket')) {
          e.preventDefault();
        }
      });
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen antialiased selection:bg-indigo-500 selection:text-white transition-colors duration-200">
    <div id="root">
      <div id="initial-loading" style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:sans-serif;color:#64748b;text-align:center;padding:20px;">
        <div style="width:40px;height:40px;border:3px solid #7c3aed;border-top-color:transparent;border-radius:50%;animation:collectaspin 0.8s linear infinite;"></div>
        <p style="margin-top:16px;font-size:14px;font-weight:600;color:#0f172a;">Iniciando CollectaHub...</p>
        <style>@keyframes collectaspin{to{transform:rotate(360deg)}}</style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
