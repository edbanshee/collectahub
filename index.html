<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CollectaHub</title>
    <meta name="description" content="CollectaHub - Centro integral de gestión de hardware, almacenamiento, accesorios y emulación retro." />
    <meta property="og:title" content="CollectaHub" />
    <meta property="og:description" content="CollectaHub - Centro integral de gestión de hardware, almacenamiento, accesorios y emulación retro." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      // Suppress Vite dev server WebSocket disconnect errors in iframe preview
      window.addEventListener('unhandledrejection', function (e) {
        if (e.reason && (String(e.reason?.message || e.reason || '')).includes('WebSocket')) {
          e.preventDefault();
        }
      });

      // Catch asset load errors or fatal bootstrap failures
      window.addEventListener('error', function (e) {
        var statusEl = document.getElementById('boot-status-text');
        if (statusEl && document.getElementById('app-boot-loader')) {
          statusEl.style.color = '#fb7185';
          statusEl.textContent = 'Error al cargar: ' + (e.message || 'Verifica la consola del navegador');
        }
      });
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen antialiased selection:bg-indigo-500 selection:text-white transition-colors duration-200">
    <div id="root">
      <div id="app-boot-loader" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: system-ui, -apple-system, sans-serif; background: #0e0e10; color: #f4f4f5; text-align: center; padding: 24px;">
        <div style="width: 48px; height: 48px; border-radius: 16px; background: linear-gradient(135deg, #9333ea, #4f46e5); display: flex; align-items: center; justify-content: center; margin-bottom: 16px; box-shadow: 0 10px 25px -5px rgba(147, 51, 234, 0.4);">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="16" height="16" x="4" y="4" rx="2"></rect>
            <rect width="6" height="6" x="9" y="9" rx="1"></rect>
            <path d="M15 2v2"></path>
            <path d="M15 20v2"></path>
            <path d="M2 15h2"></path>
            <path d="M2 9h2"></path>
            <path d="M20 15h2"></path>
            <path d="M20 9h2"></path>
            <path d="M9 2v2"></path>
            <path d="M9 20v2"></path>
          </svg>
        </div>
        <h1 style="font-size: 18px; font-weight: 800; margin: 0 0 6px 0; letter-spacing: -0.025em;">CollectaHub</h1>
        <p id="boot-status-text" style="font-size: 12px; color: #a1a1aa; margin: 0;">Iniciando aplicación...</p>
        <noscript>
          <p style="color: #fb7185; font-size: 13px; margin-top: 16px;">JavaScript es requerido para ejecutar CollectaHub.</p>
        </noscript>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
